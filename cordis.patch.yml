# Bundle defaults for the er-profile plugin.
#
# Character/weapon aliases are NOT repeated here: they live in src/config.ts
# (DEFAULT_CHARACTER_ALIASES / DEFAULT_WEAPON_ALIASES) and user overrides are
# merged on top. Add only the keys you want to override, e.g.:
#
#   config:
#     locale: en
#     characterAliases:
#       猫: 爱琳
#     outputRetention:
#       maxFiles: 100
- insert:
    - id: er-profile
      name: '@local/dsh-er-profile'
      config: {}
